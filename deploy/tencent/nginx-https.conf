server {
    listen 80;
    listen [::]:80;
    server_name petinmyall.me www.petinmyall.me;

    location = /verification.html {
        root /srv/fuchong/current/dist/client;
        default_type text/plain;
    }

    location / {
        return 301 https://petinmyall.me$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.petinmyall.me;

    ssl_certificate /etc/letsencrypt/live/petinmyall.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/petinmyall.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://petinmyall.me$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name petinmyall.me;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/petinmyall.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/petinmyall.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /srv/fuchong/current/dist/client;
    index index.html;
    client_max_body_size 32m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        expires 30d;
    }

    location ~* \.(?:avif|gif|jpe?g|png|webp|mp4|webm|mp3|wav|ogg)$ {
        return 301 https://media.petinmyall.me$request_uri;
    }

    # Keep versioned frontend assets on the already-open main-domain HTTP/2
    # connection.  The generic media redirect below would otherwise force a
    # second TLS handshake to the CDN before the home screen can paint.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    location ~ /\. {
        deny all;
    }
}
